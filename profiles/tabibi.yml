about: |
  Tabibi (طبيبي) is a Palestinian digital healthcare platform based in Gaza.
  It connects patients with doctors through appointment booking and remote
  medical consultations, and runs paperless electronic clinics with
  multi-role dashboards for patients, doctors, secretaries and admins.

  The platform includes an AI medical assistant that routes patients to the
  correct medical specialty based on their symptoms, digital prescriptions,
  full medical histories, and real-time chat between patients and doctors.

  Founded by Mazen Abu Saif (مازن أبو سيف).

about_arabic: |
  طبيبي (Tabibi) منصة طبية رقمية فلسطينية مقرها غزة، تربط المرضى بالأطباء
  عبر حجز المواعيد والاستشارات الطبية عن بُعد، وتدير العيادات الإلكترونية
  بأدوار متعددة: مريض، طبيب، سكرتير، وإدارة.

  تضم المنصة مساعدًا طبيًا ذكيًا يوجّه المريض للتخصص الطبي المناسب حسب
  الأعراض، ووصفات إلكترونية، وسجلات طبية رقمية، ومحادثات فورية بين المريض
  والطبيب.

  تأسست على يد مازن أبو سيف (Mazen Abu Saif).

